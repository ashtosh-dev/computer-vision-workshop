[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-cv-workshop"
version = "1.0.0"
description = "Beginner-friendly machine learning and computer vision workshop"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "tensorflow>=2.16,<2.18",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "jupyterlab>=4.0", "ipykernel>=6.29"]
pi = ["ultralytics>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
